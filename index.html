<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAKING: Belangrijke Mededeling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .serious-content {
            animation: fadeIn 1s ease-in;
        }

        .prank-content {
            display: none;
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .warning-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        .loading-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 2rem 0;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 100%;
            animation: loading 3s ease-in-out forwards, gradient 2s ease infinite;
            width: 0%;
        }

        .status-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 1rem;
        }

        /* Prank styles */
        .fish {
            font-size: 8rem;
            animation: swim 2s ease-in-out infinite;
            display: inline-block;
        }

        .prank-title {
            font-size: 3rem;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s ease infinite;
            margin: 1rem 0;
        }

        .haha {
            font-size: 2rem;
            margin: 1rem 0;
            animation: shake 0.5s ease-in-out infinite;
        }

        .date {
            font-size: 1.5rem;
            color: #48dbfb;
            margin-top: 2rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall linear forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes swim {
            0%, 100% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes confetti-fall {
            to {
                top: 100vh;
                transform: rotate(720deg);
            }
        }

        .bubbles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            top: 0;
            left: 0;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(72, 219, 251, 0.3);
            border-radius: 50%;
            animation: bubble-rise linear infinite;
        }

        @keyframes bubble-rise {
            to {
                transform: translateY(-110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="bubbles" id="bubbles"></div>
    
    <div class="container">
        <div class="serious-content" id="serious">
            <div class="warning-icon">&#9888;</div>
            <h1>KRITIEKE SYSTEEMFOUT GEDETECTEERD</h1>
            <p class="subtitle">Uw browser ondergaat een belangrijke beveiligingsscan...</p>
            
            <div class="loading-bar">
                <div class="loading-progress" id="progress"></div>
            </div>
            
            <p class="status-text" id="status">Initialiseren...</p>
        </div>

        <div class="prank-content" id="prank">
            <div class="fish">&#128031;</div>
            <h1 class="prank-title">HAHAHA DAT KAN NIET HE!</h1>
            <p class="haha">1 APRIL!</p>
            <p style="font-size: 1.5rem; margin: 1rem 0;">Je bent erin getrapt!</p>
            <p class="date">&#128293; Fijne 1 april 2026! &#128293;</p>
        </div>
    </div>

    <script>
        const statusMessages = [
            "Scannen van systeembestanden...",
            "Controleren van netwerkverbinding...",
            "Analyseren van browsergeschiedenis...",
            "Detecteren van verdachte activiteit...",
            "Voorbereiden van noodprotocol...",
            "Bijna klaar..."
        ];

        let messageIndex = 0;
        const statusEl = document.getElementById('status');

        const statusInterval = setInterval(() => {
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex];
                messageIndex++;
            }
        }, 500);

        // After loading bar completes
        setTimeout(() => {
            clearInterval(statusInterval);
            document.getElementById('serious').style.display = 'none';
            document.getElementById('prank').style.display = 'block';
            
            // Create confetti
            createConfetti();
            
            // Create bubbles
            createBubbles();
        }, 3500);

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);
            }
        }

        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            
            for (let i = 0; i < 20; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.width = (Math.random() * 40 + 10) + 'px';
                bubble.style.height = bubble.style.width;
                bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                bubblesContainer.appendChild(bubble);
            }
        }
    </script>
</body>
</html>
